[package]
name = "maolan-engine"
version = "0.2.53"
edition = "2024"
description = "Audio engine for the Maolan DAW with audio/MIDI tracks, routing, export, and out-of-process CLAP/VST3/LV2 plugin support"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/engine"
homepage = "https://maolan.rs"
documentation = "https://docs.rs/maolan-engine"
keywords = ["audio", "midi", "vst3", "clap", "lv2"]
categories = ["multimedia::audio"]

[dependencies]
num_cpus = "1.17.0"
tokio = { version = "1.53.1", features = ["full"] }
oxideav-core = "0.1.34"
oxideav-basic = "0.0.9"
oxideav-flac = "0.0.11"
oxideav-mp3 = "0.1.3"
oxideav-ogg = "0.1.8"
symphonia = { version = "0.5.4", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
byteorder = "1.5.0"
midly = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
maolan-plugin-protocol = "0.0.16"
uuid = { version = "1.24.0", features = ["v4"] }
wide = "1.6.0"
arc-swap = "1.9.2"
basedrop = "0.1.3"
rtrb = "0.3.4"
ebur128 = "0.1.10"
timestretch = "0.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11.0" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["ioctl", "poll"] }
jack = "0.13.5"

[target.'cfg(target_os = "windows")'.dependencies]
midir = "0.11.0"
windows = { version = "0.62.2", features = ["Win32_Devices_Properties", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
